[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krnwaller"
version = "1.0.0"
description = "高性能软件防火墙 - 多协议深度检测与现代化 UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "krnwaller Project"}
]
keywords = ["firewall", "network", "security", "dpi", "pyqt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = [
    "PyQt5>=5.15.0",
    "PyQtChart>=5.15.0",
]

[project.optional-dependencies]
capture = ["scapy>=2.4.5"]
pcap = ["pypcap>=1.2.3"]
windows = ["pydivert>=2.1.0"]
full = ["scapy>=2.4.5", "pypcap>=1.2.3", "pydivert>=2.1.0"]

[project.scripts]
krnwaller = "main:main"

[tool.setuptools]
packages = ["core", "protocols", "rules", "ui", "utils", "config"]
